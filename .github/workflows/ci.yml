name: CI

#  The UNBUNDLED build (JAB-036): plain `quickjab` over the in-tree engine and
#  its own API suite — no jsrc pack, which is bee's release build instead
#  (JAB-035, bee/.github/build-bee.sh).  Every dep is a submodule, so the
#  checkout is recursive: qjs (engine), dog (dog+abc), test (the ctest suite).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  unbundled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      #  curl is a hard dep of the build (abc carries CURL.c, CMakeLists.txt:24:Yu);
      #  sodium/lz4/zlib come in through abc and dog, as in libdog's own CI.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang \
            libsodium-dev libcurl4-gnutls-dev liblz4-dev zlib1g-dev

      - name: Configure
        run: >
          cmake -B build -GNinja
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: ninja -C build

      #  --no-tests=error: the JABC* legs are gated on ${JAB_TEST}/*.js, so an
      #  unfetched test/ submodule would otherwise pass as an empty suite.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 4 --no-tests=error
